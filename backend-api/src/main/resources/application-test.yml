# Development-only smoke profile. This lets `mvn spring-boot:run` start without
# requiring a local MySQL account while keeping production on the `prod` profile.
spring:
  datasource:
    url: jdbc:h2:mem:edupath_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true

edupath:
  demo-task-delay-millis: 0
  ai-service-base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
  jwt:
    secret: test-edupath-jwt-secret-test-edupath
    ttl-seconds: 3600
  storage:
    provider: local
    local-root: target/local-smoke-storage
    signing-secret: test-edupath-storage-signing-secret
